<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resultados — Concurso de monólogos</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 id="title">Resultados</h1>
  <p class="subtitle" id="subtitle">Cargando…</p>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    const app = document.getElementById('app');
    const subtitle = document.getElementById('subtitle');
    const title = document.getElementById('title');

    let currentEditionId = null;
    let currentEdition = null;
    let stopCountVotes = null;

    watchActiveEdition((editionId, edition) => {
      currentEditionId = editionId;
      currentEdition = edition;
      render();
    });

    function render() {
      if (stopCountVotes) { stopCountVotes(); stopCountVotes = null; }

      if (!currentEditionId || !currentEdition) {
        title.textContent = 'Resultados';
        subtitle.textContent = 'Todavía no hay ninguna votación configurada.';
        app.innerHTML = '';
        return;
      }

      title.textContent = 'Concurso de monólogos ' + currentEdition.year;

      if (!currentEdition.published) {
        subtitle.textContent = '';
        app.innerHTML = `<div class="status-box">🤫 Los resultados aún no se han publicado.<br>Vuelve a mirar en un rato.</div>`;
        return;
      }

      subtitle.textContent = 'En directo';
      app.innerHTML = `<div class="results-list" id="list"></div><div class="total-votes" id="total"></div>`;
      stopCountVotes = countVotes(currentEditionId, renderCounts);
    }

    function renderCounts(counts, total) {
      const list = document.getElementById('list');
      const totalEl = document.getElementById('total');
      if (!list) return;
      const names = currentEdition.names || [];
      const max = Math.max(1, ...counts);
      const rows = names.map((name, idx) => ({
        name, idx, votes: counts[idx] || 0,
        pct: total > 0 ? Math.round(((counts[idx] || 0) / total) * 100) : 0
      }));
      rows.sort((a, b) => b.votes - a.votes);

      list.innerHTML = rows.map((r, pos) => `
        <div class="result-row ${pos === 0 && r.votes > 0 ? 'leader' : ''}">
          <div class="top">
            <span>${String(r.idx + 1).padStart(2, '0')} · ${escapeHtml(r.name)}</span>
            <span>${r.votes} voto${r.votes === 1 ? '' : 's'} (${r.pct}%)</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${(r.votes / max) * 100}%"></div></div>
        </div>
      `).join('');

      totalEl.textContent = `Total de votos: ${total}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
