<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Vota — Concurso de monólogos</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 id="title">Concurso de monólogos</h1>
  <p class="subtitle" id="subtitle">Cargando…</p>

  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    const app = document.getElementById('app');
    const subtitle = document.getElementById('subtitle');
    const title = document.getElementById('title');

    let currentEditionId = null;
    let currentEdition = null;
    let selectedIndex = null;
    let timerInterval = null;

    watchActiveEdition((editionId, edition) => {
      currentEditionId = editionId;
      currentEdition = edition;
      render();
    });

    function render() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      if (!currentEditionId || !currentEdition) {
        title.textContent = 'Concurso de monólogos';
        subtitle.textContent = 'Todavía no hay ninguna votación configurada.';
        app.innerHTML = '';
        return;
      }

      title.textContent = 'Concurso de monólogos ' + currentEdition.year;

      if (hasVotedLocally(currentEditionId)) {
        renderVoted();
        return;
      }

      if (currentEdition.status === 'draft') {
        subtitle.textContent = 'La votación aún no ha comenzado.';
        app.innerHTML = `<div class="status-box">Espera a que el organizador abra la votación. Actualiza esta página cuando empiece.</div>`;
        return;
      }

      if (currentEdition.status === 'closed') {
        subtitle.textContent = 'La votación ha terminado.';
        app.innerHTML = `
          <div class="status-box">Gracias por participar. La votación ya está cerrada.</div>
          <button class="btn btn-secondary" onclick="location.href='resultados.html'">Ver resultados</button>
        `;
        return;
      }

      // status === 'voting'
      subtitle.textContent = 'Elige a tu favorito y confirma tu voto.';
      selectedIndex = null;
      renderVotingScreen();
      timerInterval = setInterval(updateTimer, 250);
      updateTimer();
    }

    function renderVotingScreen() {
      const names = currentEdition.names || [];
      app.innerHTML = `
        <div id="timer" class="timer"></div>
        <div class="card-grid" id="grid"></div>
        <button class="btn btn-primary" id="confirmBtn" disabled>Confirmar voto</button>
      `;
      const grid = document.getElementById('grid');
      names.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'candidate';
        btn.innerHTML = `<span class="num">${String(idx + 1).padStart(2, '0')}</span><span class="name">${escapeHtml(name)}</span>`;
        btn.onclick = () => selectCandidate(idx);
        grid.appendChild(btn);
      });
      document.getElementById('confirmBtn').onclick = confirmVote;
    }

    function selectCandidate(idx) {
      selectedIndex = idx;
      document.querySelectorAll('.candidate').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
      });
      document.getElementById('confirmBtn').disabled = false;
    }

    async function confirmVote() {
      if (selectedIndex === null || !currentEditionId) return;
      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Enviando…';
      try {
        const voterId = getVoterId();
        const ref = db.ref('votes/' + currentEditionId + '/' + voterId);
        const snap = await ref.get();
        if (!snap.exists()) {
          await ref.set(selectedIndex);
        }
        markVotedLocally(currentEditionId);
        renderVoted();
      } catch (e) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirmar voto';
        alert('No se pudo registrar el voto. Comprueba tu conexión e inténtalo de nuevo.');
      }
    }

    function renderVoted() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      subtitle.textContent = '';
      app.innerHTML = `
        <div class="status-box ok">✅ Tu voto ha sido registrado.<br>¡Gracias por participar!</div>
        <button class="btn btn-secondary" onclick="location.href='resultados.html'">Ver resultados</button>
      `;
    }

    function updateTimer() {
      const timerEl = document.getElementById('timer');
      if (!timerEl || !currentEdition.timerStartedAt) return;
      const elapsed = serverNow() - currentEdition.timerStartedAt;
      const remaining = currentEdition.timerDurationSec * 1000 - elapsed;
      if (remaining <= 0) {
        timerEl.textContent = '00:00';
        timerEl.classList.add('ended');
      } else {
        timerEl.textContent = formatTime(remaining);
        timerEl.classList.remove('ended');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
