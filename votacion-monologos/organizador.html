<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Organizador — Concurso de monólogos</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Panel del organizador</h1>
  <p class="subtitle" id="subtitle">Introduce el código de acceso</p>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script>
    // Cambia este código antes del evento. No es seguridad real (cualquiera con
    // acceso al código de esta página puede leerlo) — solo evita toques accidentales.
    const ORGANIZER_CODE = 'MONOLOGO';

    const app = document.getElementById('app');
    const subtitle = document.getElementById('subtitle');

    let currentEditionId = null;
    let currentEdition = null;
    let stopCountVotes = null;

    if (sessionStorage.getItem('organizador_ok') === '1') {
      showPanel();
    } else {
      showGate();
    }

    function showGate() {
      app.innerHTML = `
        <input type="password" id="code" placeholder="Código de acceso" style="max-width:280px" />
        <button class="btn btn-primary" style="max-width:280px" id="enterBtn">Entrar</button>
      `;
      document.getElementById('enterBtn').onclick = () => {
        const val = document.getElementById('code').value;
        if (val === ORGANIZER_CODE) {
          sessionStorage.setItem('organizador_ok', '1');
          showPanel();
        } else {
          alert('Código incorrecto.');
        }
      };
    }

    function showPanel() {
      subtitle.textContent = '';
      app.innerHTML = `
        <div class="panel-section" id="activeSection"></div>
        <div class="panel-section" id="newEditionSection"></div>
        <div class="panel-section" id="historySection"></div>
      `;
      watchActiveEdition((editionId, edition) => {
        currentEditionId = editionId;
        currentEdition = edition;
        renderActiveSection();
      });
      renderNewEditionForm();
      renderHistory();
    }

    // ---------- Edición activa ----------

    function renderActiveSection() {
      const el = document.getElementById('activeSection');
      if (stopCountVotes) { stopCountVotes(); stopCountVotes = null; }
      if (!currentEditionId || !currentEdition) {
        el.innerHTML = `<h2>Edición activa</h2><p>No hay ninguna edición activa todavía. Crea una abajo.</p>`;
        return;
      }

      const votarUrl = new URL('votar.html', location.href).toString();
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(votarUrl);

      el.innerHTML = `
        <h2>Edición activa — ${currentEdition.year}
          <span class="pill ${currentEdition.status}">${statusLabel(currentEdition.status)}</span>
          ${currentEdition.published ? '<span class="pill published">PUBLICADO</span>' : ''}
        </h2>
        <p>${(currentEdition.names || []).map((n, i) => (i + 1) + '. ' + escapeHtml(n)).join('<br>')}</p>

        <div class="row">
          <button class="btn btn-primary" id="startBtn" ${currentEdition.status !== 'draft' ? 'disabled' : ''}>Iniciar votación (10 min)</button>
          <button class="btn btn-danger" id="closeBtn" ${currentEdition.status !== 'voting' ? 'disabled' : ''}>Cerrar votación</button>
        </div>
        <div class="row">
          <button class="btn btn-secondary" id="publishBtn">${currentEdition.published ? 'Ocultar resultados' : 'Publicar resultados'}</button>
        </div>

        <div id="liveCounts"></div>

        <p style="margin-top:16px">Link para votar (compártelo o enseña el QR):</p>
        <div class="link-box">${votarUrl}</div>
        <div class="qr-box"><img src="${qrUrl}" alt="QR para votar" width="150" height="150" /></div>
      `;

      document.getElementById('startBtn').onclick = startVoting;
      document.getElementById('closeBtn').onclick = closeVoting;
      document.getElementById('publishBtn').onclick = togglePublish;

      stopCountVotes = countVotes(currentEditionId, (counts, total) => {
        const names = currentEdition.names || [];
        const liveEl = document.getElementById('liveCounts');
        if (!liveEl) return;
        liveEl.innerHTML = `<p style="margin-top:14px"><strong>Votos en directo (total: ${total})</strong><br>` +
          names.map((n, i) => `${i + 1}. ${escapeHtml(n)}: ${counts[i] || 0}`).join('<br>') + '</p>';
      });
    }

    function statusLabel(status) {
      return { draft: 'SIN EMPEZAR', voting: 'VOTACIÓN ABIERTA', closed: 'CERRADA' }[status] || status;
    }

    async function startVoting() {
      await db.ref('editions/' + currentEditionId).update({
        status: 'voting',
        timerStartedAt: firebase.database.ServerValue.TIMESTAMP,
        timerDurationSec: 600
      });
    }

    async function closeVoting() {
      if (!confirm('¿Cerrar la votación? Los votantes ya no podrán votar.')) return;
      await db.ref('editions/' + currentEditionId).update({ status: 'closed' });
    }

    async function togglePublish() {
      await db.ref('editions/' + currentEditionId).update({ published: !currentEdition.published });
    }

    // ---------- Nueva edición ----------

    function renderNewEditionForm() {
      const el = document.getElementById('newEditionSection');
      const year = new Date().getFullYear();
      el.innerHTML = `
        <h2>Nueva edición</h2>
        <label>Año</label>
        <input type="number" id="f_year" value="${year}" />
        <label>Fecha</label>
        <input type="date" id="f_date" value="${new Date().toISOString().slice(0, 10)}" />
        ${[1, 2, 3, 4, 5].map(n => `
          <label>Participante ${n}</label>
          <input type="text" id="f_name_${n}" placeholder="Nombre del participante ${n}" />
        `).join('')}
        <button class="btn btn-primary" id="createBtn">Crear y activar edición</button>
      `;
      document.getElementById('createBtn').onclick = createEdition;
    }

    async function createEdition() {
      const year = document.getElementById('f_year').value.trim();
      const date = document.getElementById('f_date').value;
      const names = [1, 2, 3, 4, 5].map(n => document.getElementById('f_name_' + n).value.trim());

      if (!year || names.some(n => !n)) {
        alert('Rellena el año y los 5 nombres.');
        return;
      }

      const existing = await db.ref('editions/' + year).get();
      if (existing.exists()) {
        if (!confirm('Ya existe una edición para ' + year + '. ¿Quieres sobrescribirla?')) return;
      }

      await db.ref('editions/' + year).set({
        year: Number(year),
        date,
        names,
        status: 'draft',
        published: false,
        timerStartedAt: null,
        timerDurationSec: 600,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      await db.ref('activeEditionId').set(String(year));
      renderHistory();
    }

    // ---------- Historial ----------

    async function renderHistory() {
      const el = document.getElementById('historySection');
      el.innerHTML = '<h2>Historial de ediciones</h2><p>Cargando…</p>';
      const snap = await db.ref('editions').get();
      if (!snap.exists()) {
        el.innerHTML = '<h2>Historial de ediciones</h2><p>Todavía no hay ninguna edición registrada.</p>';
        return;
      }
      const editions = [];
      snap.forEach(child => editions.push({ id: child.key, ...child.val() }));
      editions.sort((a, b) => b.year - a.year);

      const items = await Promise.all(editions.map(async (ed) => {
        const votesSnap = await db.ref('votes/' + ed.id).get();
        const counts = [0, 0, 0, 0, 0];
        if (votesSnap.exists()) {
          votesSnap.forEach(v => {
            const idx = v.val();
            if (idx >= 0 && idx <= 4) counts[idx]++;
          });
        }
        const results = (ed.names || []).map((n, i) => `${n}: ${counts[i] || 0}`).join(' · ');
        return `
          <div class="history-item">
            <strong>${ed.year}</strong> (${ed.date || '—'})
            <span class="pill ${ed.status}">${statusLabel(ed.status)}</span>
            ${ed.published ? '<span class="pill published">PUBLICADO</span>' : ''}
            ${ed.id === currentEditionId ? ' — <em>activa</em>' : `<button class="btn-ghost" onclick="activateEdition('${ed.id}')">activar</button>`}
            <br><small>${results}</small>
          </div>
        `;
      }));

      el.innerHTML = '<h2>Historial de ediciones</h2>' + items.join('');
    }

    async function activateEdition(id) {
      if (!confirm('¿Activar la edición ' + id + '? Sustituirá a la edición activa actual como destino del link de votación.')) return;
      await db.ref('activeEditionId').set(id);
      renderHistory();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
