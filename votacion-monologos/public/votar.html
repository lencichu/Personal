<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Vota — Concurso de monólogos</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 id="title">Concurso de monólogos</h1>
  <p class="subtitle" id="subtitle">Cargando…</p>
  <img id="banner" class="banner" style="display:none" alt="" />
  <div id="app"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="common.js"></script>
  <script>
    const app = document.getElementById('app');
    const subtitle = document.getElementById('subtitle');
    const title = document.getElementById('title');

    let state = null;
    let alreadyVoted = false;
    let selectedIndex = null;
    let timerInterval = null;
    let statusToken = 0;

    onState(async (s) => {
      state = s;
      const token = ++statusToken;
      if (s.editionId) {
        try {
          const vs = await fetch('/api/vote-status/' + s.editionId).then((r) => r.json());
          if (token !== statusToken) return; // llegó una actualización más reciente mientras esperábamos
          alreadyVoted = vs.voted;
        } catch (e) {
          alreadyVoted = false;
        }
      } else {
        alreadyVoted = false;
      }
      render();
    });

    function render() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      const bannerEl = document.getElementById('banner');
      if (state && state.banner) {
        bannerEl.src = state.banner;
        bannerEl.style.display = 'block';
      } else {
        bannerEl.style.display = 'none';
      }

      if (!state || !state.editionId) {
        title.textContent = 'Concurso de monólogos';
        subtitle.textContent = 'Todavía no hay ninguna votación configurada.';
        app.innerHTML = '';
        return;
      }

      title.textContent = 'Concurso de monólogos ' + state.year;

      if (alreadyVoted) {
        renderVoted();
        return;
      }

      if (state.status === 'draft') {
        subtitle.textContent = 'La votación aún no ha comenzado.';
        app.innerHTML = `<div class="status-box">Espera a que el organizador abra la votación.</div>`;
        return;
      }

      if (state.status === 'closed') {
        subtitle.textContent = 'La votación ha terminado.';
        app.innerHTML = `
          <div class="status-box">Gracias por participar. La votación ya está cerrada.</div>
          <button class="btn btn-secondary" onclick="location.href='resultados.html'">Ver resultados</button>
        `;
        return;
      }

      // status === 'voting'
      subtitle.textContent = 'Elige a tu favorito y confirma tu voto.';
      selectedIndex = null;
      renderVotingScreen();
      timerInterval = setInterval(updateTimer, 250);
      updateTimer();
    }

    function renderVotingScreen() {
      const names = state.names || [];
      app.innerHTML = `
        <div id="timer" class="timer"></div>
        <div class="card-grid" id="grid"></div>
        <button class="btn btn-primary" id="confirmBtn" disabled>Confirmar voto</button>
      `;
      const grid = document.getElementById('grid');
      names.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = 'candidate';
        const photoUrl = state.photos && state.photos[idx];
        btn.innerHTML = `
          <span class="num">${String(idx + 1).padStart(2, '0')}</span>
          ${photoUrl ? `<img class="photo" src="${photoUrl}" alt="" />` : ''}
          <span class="name">${escapeHtml(name)}</span>
        `;
        btn.onclick = () => selectCandidate(idx);
        grid.appendChild(btn);
      });
      document.getElementById('confirmBtn').onclick = confirmVote;
    }

    function selectCandidate(idx) {
      selectedIndex = idx;
      document.querySelectorAll('.candidate').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
      });
      document.getElementById('confirmBtn').disabled = false;
    }

    async function confirmVote() {
      if (selectedIndex === null || !state || !state.editionId) return;
      const confirmBtn = document.getElementById('confirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Enviando…';
      try {
        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ editionId: state.editionId, candidateIndex: selectedIndex })
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.error || 'vote failed');
        }
        alreadyVoted = true;
        renderVoted();
      } catch (e) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirmar voto';
        alert('No se pudo registrar el voto. Comprueba tu conexión e inténtalo de nuevo.');
      }
    }

    function renderVoted() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      subtitle.textContent = '';
      app.innerHTML = `
        <div class="status-box ok">✅ Tu voto ha sido registrado.<br>¡Gracias por participar!</div>
        <button class="btn btn-secondary" onclick="location.href='resultados.html'">Ver resultados</button>
      `;
    }

    function updateTimer() {
      const timerEl = document.getElementById('timer');
      if (!timerEl || !state.timerStartedAt) return;
      const elapsed = serverNow() - state.timerStartedAt;
      const remaining = state.timerDurationSec * 1000 - elapsed;
      if (remaining <= 0) {
        timerEl.textContent = '00:00';
        timerEl.classList.add('ended');
      } else {
        timerEl.textContent = formatTime(remaining);
        timerEl.classList.remove('ended');
      }
    }
  </script>
</body>
</html>
